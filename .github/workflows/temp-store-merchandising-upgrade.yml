name: Temporary Store Merchandising Upgrade

on:
  push:
    branches:
      - feat/store-intake-merchandising-upgrade

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/store-intake-merchandising-upgrade
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded additive patch
        run: python3 scripts/store_merchandising_upgrade.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Commit verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/businesses.store-inventory.tsx src/lib/store-product-import.server.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated code changes to commit"
            exit 0
          fi
          git commit -m "feat(store): add smart multi-department merchandising intake"
          git push origin HEAD:feat/store-intake-merchandising-upgrade
