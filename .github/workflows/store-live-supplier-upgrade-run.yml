name: Store intelligence upgrade runner

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/store-live-supplier-upgrade-run.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.head_ref == 'feat/store-live-supplier-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-live-supplier-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and run the reviewed dashboard patch
        run: |
          awk '/python - <<'"'"'PY'"'"'/{flag=1;next} /^[[:space:]]+PY$/{if(flag){exit}} flag{sub(/^          /,""); print}' .github/workflows/store-live-supplier-upgrade-pr.yml > /tmp/store-intelligence-upgrade.py
          python /tmp/store-intelligence-upgrade.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Commit validated dashboard change
        run: |
          git config user.name "cossa-upgrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/businesses.store-inventory.tsx
          if git diff --cached --quiet; then
            echo "No route change to commit"
            exit 0
          fi
          git commit -m "Upgrade Store Operations with live supplier intelligence [skip ci]"
          git push origin HEAD:feat/store-live-supplier-intelligence
