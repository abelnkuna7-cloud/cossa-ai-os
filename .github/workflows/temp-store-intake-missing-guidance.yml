name: Temporary Store Intake Missing Guidance

on:
  push:
    branches:
      - feat/store-intake-missing-field-guidance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded intake guidance patch
        run: python3 scripts/apply_store_intake_missing_guidance.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format changed intake route
        run: npx prettier --write src/routes/businesses.store-inventory.tsx
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Commit generated intake upgrade
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "cossa-growth-upgrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/businesses.store-inventory.tsx
          git commit -m "feat(store): add field-level intake readiness guidance"
          git push
