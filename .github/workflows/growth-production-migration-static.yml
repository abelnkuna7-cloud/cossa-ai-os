name: Check Growth migration infrastructure

on:
  pull_request:
    paths:
      - .github/actions/growth-production-migration-gate/**
      - .github/workflows/growth-production-migration-*.yml
      - docs/GROWTH_PRODUCTION_MIGRATION_RUNBOOK.md
      - scripts/growth-production-migration-guard.mjs
      - tests/growth-production-migration-guard.test.mjs
  push:
    branches:
      - infrastructure/growth-production-migration-v1
    paths:
      - .github/actions/growth-production-migration-gate/**
      - .github/workflows/growth-production-migration-*.yml
      - docs/GROWTH_PRODUCTION_MIGRATION_RUNBOOK.md
      - scripts/growth-production-migration-guard.mjs
      - tests/growth-production-migration-guard.test.mjs
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  static-checks:
    name: Static safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out infrastructure source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate GitHub Actions semantics with pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_root="$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root" actionlint
          "$install_root/actionlint" -no-color \
            .github/workflows/growth-production-migration-static.yml \
            .github/workflows/growth-production-migration-validate.yml \
            .github/workflows/growth-production-migration-execute.yml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.117.0

      - name: Check out immutable Product Manager source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 84cda377cfaa54bee3e675d9c0e7ee1e2bd99823
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Run migration guard tests
        run: node --test tests/growth-production-migration-guard.test.mjs

      - name: Verify immutable migration source and hash
        run: |
          set -euo pipefail
          node scripts/growth-production-migration-guard.mjs verify-source \
            --source-commit 84cda377cfaa54bee3e675d9c0e7ee1e2bd99823 \
            --expected-sha256 5bdcf89f7b218b6c6d106ffeec2117b3741fb6337a521209d326b51676c63140 \
            --source-root source \
            --hash-output "$RUNNER_TEMP/target-sha256.txt"

      - name: Verify pinned CLI surface
        run: |
          set -euo pipefail
          [[ "$(supabase --version)" == "2.117.0" ]]
          supabase migration fetch --help | grep -F -- "--project-ref"
          supabase migration list --help | grep -F -- "--output-format"
          supabase db push --help | grep -F -- "--dry-run"
          supabase db push --help | grep -F -- "--skip-vault"

      - name: Inspect current Growth production Environment configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_file="$RUNNER_TEMP/growth-production-environment.json"
          branch_file="$RUNNER_TEMP/growth-production-environment-branches.json"
          status="$(curl --silent --show-error --output "$environment_file" --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/growth-production")"
          if [[ "$status" == "404" ]]; then
            echo "Growth production Environment status: not configured" >&2
            exit 1
          fi
          if [[ "$status" != "200" ]]; then
            echo "Growth production Environment inspection failed with HTTP $status" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/growth-production/deployment-branch-policies" \
            > "$branch_file"
          node scripts/growth-production-migration-guard.mjs verify-environment \
            --environment-file "$environment_file" \
            --branch-file "$branch_file"
          echo "Growth production Environment status: reviewer gate, no admin bypass and main-only branch policy configured"
