name: Temporary workforce view cleanup

on:
  push:
    branches:
      - fix/workforce-selected-view-visibility

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Apply clean workforce view rendering') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workforce-selected-view-visibility
          fetch-depth: 0

      - name: Render shared summary only in Command Centre
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/ai.workforce.tsx')
          text = path.read_text()

          start_marker = '      {/* COMPANY METRICS */}\n\n'
          end_marker = '      {/* COMMAND CENTRE */}'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Expected workforce render markers were not found')

          before, rest = text.split(start_marker, 1)
          shared, after = rest.split(end_marker, 1)

          if '{view === "command" ? (' in shared:
              raise SystemExit('Command-only rendering is already applied')

          replacement = (
              start_marker
              + '      {view === "command" ? (\n'
              + '        <>\n'
              + shared
              + '        </>\n'
              + '      ) : null}\n\n'
              + end_marker
          )

          path.write_text(before + replacement + after)

      - name: Commit branch cleanup
        run: |
          git config user.name "cossa-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/ai.workforce.tsx
          git commit -m "Apply clean workforce view rendering"
          git push origin HEAD:fix/workforce-selected-view-visibility
