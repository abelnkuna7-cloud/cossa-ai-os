name = "cossa-owner-alerts"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Create the namespace first, then replace the placeholder below. The binding
# prevents a webhook retry from sending the owner the same alert repeatedly.
[[kv_namespaces]]
binding = "ALERT_DEDUP"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"
